name: test

on:
  push:
  pull_request:

jobs:
  selftests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install -e .
      - name: Configure a git identity for the commits the suites make
        run: |
          git config --global user.name "shoal-ci"
          git config --global user.email "shoal-ci@users.noreply.github.com"
      - name: Run the selftests hermetically
        env:
          SHOAL_TEST_NO_SYSTEMD: "1"
        run: |
          for suite in selftest_ledger.sh selftest_h4.sh selftest_h8.sh selftest_ui.sh selftest_usage.sh selftest_providers.sh; do
            bash tests/selftest_hermetic.sh "$suite"
          done
