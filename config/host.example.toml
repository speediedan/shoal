# Host configuration for this package. Copy to config/host.toml (gitignored) or point
# $SHOAL_CONFIG at your copy. Every key is optional: an environment variable wins over the
# file, and a missing key falls back to a generic default (see shoal/config.py).

# Per-shoal local home (briefs, reports, telemetry). Env: SHOAL_DATA_ROOT.
# Default: $XDG_DATA_HOME/shoal, else ~/.local/share/shoal
# data_root = "/path/to/bulk/storage/shoals"

# Local clone of the ledger (queue) repository. Env: SHOAL_LEDGER_DIR. Default: <data_root>/ledger
# ledger_dir = "/path/to/ledger-clone"

# Remote of the ledger repository. Env: SHOAL_LEDGER_REPO. Default: "" (then `start` and
# `ledger-init` require --ledger-repo explicitly)
# ledger_repo = "git@github.com:<owner>/<ledger-repo>.git"

# PATH put ahead of the inherited PATH for every tool call and in generated systemd units
# (a systemd --user PATH lacks node/bun installs). Env: SHOAL_TOOL_PATH. Default: the current PATH
# tool_path = "/path/to/node/bin:/usr/local/bin:/usr/bin:/bin"

# Resource lease provider (docs/providers.md): must answer `<cmd> --status --json`.
# Env: SHOAL_LEASE_CMD, then GPU_LEASE_CMD. Default: "" (lease waits resolve as unknown)
# lease_cmd = "/path/to/lease_provider.sh"

# Signed standing grants (shoal grant): the maintainer's signing key (signing host only; a
# passphrase or FIDO key, never loaded into ssh-agent) and the allowed_signers file every host
# verifies against. Env: SHOAL_GRANT_KEY / SHOAL_GRANT_ALLOWED_SIGNERS.
# grant_key = "~/.ssh/shoal_grant"
# grant_allowed_signers = "~/.config/shoal/allowed_signers"

# Repositories a shoal works when its spec names none (reconcile ground truth). Default: []
# default_repos = ["<owner>/<repo>", "<owner>/<other-repo>"]

# Command line that runs the SHOAL CLI, as printed in briefs, role docs and systemd units.
# Env: SHOAL_CLI. Default: `shoal` when that console script is on PATH, else
# python3 <absolute path of this package>/cli.py
# cli = "python3 /path/to/shoal/cli.py"

# Host memory-pressure event log written by psi_watch.py. Env: SHOAL_PSI_OUT.
# Default: <data_root>/_instruments/psi_events.jsonl
# psi_out = "/path/to/psi_events.jsonl"

# Host name recorded on every telemetry event. Env: SHOAL_SERVER. Default: this host's name
# server = "<hostname>"

# IANA time zone for local wall-clock display in telemetry and reports. Env: SHOAL_TZ.
# Default: $TZ or /etc/timezone when it is an IANA name, else UTC
# timezone = "Area/City"

# GitHub owner stripped from item keys (<owner>/<repo>#<n> -> <repo>#<n>). Env: SHOAL_DEFAULT_OWNER.
# Default: "" (every owner kept)
# default_owner = "<owner>"

# Azure Pipelines org URL and project, for the pipeline sensor and the report's GPU share.
# Env: SHOAL_AZURE_ORG, SHOAL_AZURE_PROJECT. Default: "" (those features are off)
# azure_org = "https://dev.azure.com/<org>"
# azure_project = "<project>"
# Every project an `az-build:<id>` wait target may live in, tried in order (a build id is unique in its
# organization, but the CLI needs its project). Default: [azure_project].
# azure_projects = ["<project>", "<other project>"]

# Tools whose calls (wait-target checks) run under `bash -lc`, for a credential exported only from a login
# profile: health units get no profile, and `az` without AZURE_DEVOPS_EXT_PAT hangs to the timeout.
# Default: [] (tools run in the tool environment as they are).
# login_shell_tools = ["az"]

# Extra environment for every tool call and generated systemd unit, for a host whose harness services
# sit somewhere non-default (e.g. an OpenChamber server kept apart from a desktop app). An exported
# variable still wins; PATH stays `tool_path`. Default: none.
# [tool_env]
# OPENCHAMBER_DATA_DIR = "~/.local/share/shoal/openchamber"

# ssh routes to the other hosts of a multi-host shoal: this host's viewer gives their roles cards and
# attaches them by running that host's `shoal view` over ssh. One table per other host's `server` name.
# `resolve = "tailscale"` (the default when tailscale is on PATH) looks the name up with
# `tailscale ip -4`, so a host whose resolver does not accept tailnet DNS still reaches a MagicDNS name.
# Optional: ssh_opts (extra ssh arguments), cli (the shoal command there; default `shoal` under bash -lc).
# Default: no routes (other hosts' roles are shown, never attached).
# [hosts.<server>]
# ssh = "<user>@<magicdns-name>"

# CI pool placement (`job run --place`, `shoal pool`): where a placed job's pushed SHA is staged as a
# detached worktree on this host (a mirror clone per repository sits under `.mirrors/` there).
# Env: SHOAL_WORKTREE_ROOT. Default: <data_root>/_pool/worktrees
# worktree_root = "/path/to/scratch/worktrees"

# Named CI environments this host offers placed jobs (`job run --ci-env NAME` is placed only on hosts
# that have NAME). `python` is the interpreter (its directory is put first on PATH and exported as
# SHOAL_ENV_PYTHON); `repos` lists the repositories it serves (empty: any). Default: none.
# [ci_envs.<name>]
# python = "/path/to/venvs/<name>/bin/python"
# repos = ["<owner>/<repo>"]
