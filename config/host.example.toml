# Host configuration for this package. Copy to config/host.toml (gitignored) or point
# $SHOAL_CONFIG at your copy. Every key is optional: an environment variable wins over the
# file, and a missing key falls back to a generic default (see shoal/config.py).

# Per-shoal local home (briefs, reports, telemetry). Env: SHOAL_DATA_ROOT.
# Default: $XDG_DATA_HOME/shoal, else ~/.local/share/shoal
# data_root = "/path/to/bulk/storage/shoals"

# Local clone of the ledger (queue) repository. Env: SHOAL_LEDGER_DIR. Default: <data_root>/ledger
# ledger_dir = "/path/to/ledger-clone"

# Remote of the ledger repository. Env: SHOAL_LEDGER_REPO. Default: "" (then `start` and
# `ledger-init` require --ledger-repo explicitly)
# ledger_repo = "git@github.com:<owner>/<ledger-repo>.git"

# PATH put ahead of the inherited PATH for every tool call and in generated systemd units
# (a systemd --user PATH lacks node/bun installs). Env: SHOAL_TOOL_PATH. Default: the current PATH
# tool_path = "/path/to/node/bin:/usr/local/bin:/usr/bin:/bin"

# Resource lease provider (docs/providers.md): must answer `<cmd> --status --json`.
# Env: SHOAL_LEASE_CMD, then GPU_LEASE_CMD. Default: "" (lease waits resolve as unknown)
# lease_cmd = "/path/to/lease_provider.sh"

# Signed standing grants (shoal grant): the maintainer's signing key (signing host only; a
# passphrase or FIDO key, never loaded into ssh-agent) and the allowed_signers file every host
# verifies against. Env: SHOAL_GRANT_KEY / SHOAL_GRANT_ALLOWED_SIGNERS.
# grant_key = "~/.ssh/shoal_grant"
# grant_allowed_signers = "~/.config/shoal/allowed_signers"

# Repositories a shoal works when its spec names none (reconcile ground truth). Default: []
# default_repos = ["<owner>/<repo>", "<owner>/<other-repo>"]

# Command line that runs the SHOAL CLI, as printed in briefs, role docs and systemd units.
# Env: SHOAL_CLI. Default: `shoal` when that console script is on PATH, else
# python3 <absolute path of this package>/cli.py
# cli = "python3 /path/to/shoal/cli.py"

# Host memory-pressure event log written by psi_watch.py. Env: SHOAL_PSI_OUT.
# Default: <data_root>/_instruments/psi_events.jsonl
# psi_out = "/path/to/psi_events.jsonl"

# Host name recorded on every telemetry event. Env: SHOAL_SERVER. Default: this host's name
# server = "<hostname>"

# IANA time zone for local wall-clock display in telemetry and reports. Env: SHOAL_TZ.
# Default: $TZ or /etc/timezone when it is an IANA name, else UTC
# timezone = "Area/City"

# GitHub owner stripped from item keys (<owner>/<repo>#<n> -> <repo>#<n>). Env: SHOAL_DEFAULT_OWNER.
# Default: "" (every owner kept)
# default_owner = "<owner>"

# Azure Pipelines org URL and project, for the pipeline sensor and the report's GPU share.
# Env: SHOAL_AZURE_ORG, SHOAL_AZURE_PROJECT. Default: "" (those features are off)
# azure_org = "https://dev.azure.com/<org>"
# azure_project = "<project>"
# Every project an `az-build:<id>` wait target may live in, tried in order (a build id is unique in its
# organization, but the CLI needs its project). Default: [azure_project].
# azure_projects = ["<project>", "<other project>"]

# This host's Azure Pipelines self-hosted agent, taken out of rotation while a research reservation (`shoal pool
# reserve`) stands here: the user capabilities below are removed from it, so jobs demanding them go to another agent,
# and exactly what was removed is put back when the last reservation here ends. A build already waiting here on a
# reserved device is cancelled at its stage and the stage retried, so it lands on another agent. On wherever azure_org
# is set. The PAT file (mode 600) needs Agent Pools (Read & manage) and Build (Read & execute); without it the
# reservation still succeeds and the agent stays in rotation (`pool status` and `doctor` say so). Env for the path:
# SHOAL_AZURE_AGENT_PAT. Every key is optional; the defaults are shown.
# [azure_agent]
# pat = "~/.config/shoal/azure-agent-pat"
# name = "<this host's server name>"     # the agent's name in the pool
# pool = "Default"
# capabilities = ["ci-any-vendor"]       # add "ci-vendor-marked" to fail a vendor-pinned leg at once instead of waiting
# requeue = true                         # false: a build already waiting here is left (its owner is still told)
# waiter_pattern = '^azure-(?:.*-)?(\d+)$'   # how a lease waiter names its build (group 1: the build id)
# swap = true                            # every pool host reserved: keep in the agent whose host has the most free
#                                        # usable capacity (reads the other hosts' `pool probe` over their routes)
# large_gpu_gib = 16                     # a GPU this large or larger counts as large in that comparison
# enabled = false                        # off on this host

# Tools whose calls (wait-target checks) run under `bash -lc`, for a credential exported only from a login
# profile: health units get no profile, and `az` without AZURE_DEVOPS_EXT_PAT hangs to the timeout.
# Default: [] (tools run in the tool environment as they are).
# login_shell_tools = ["az"]

# Extra environment for every tool call and generated systemd unit, for a host whose harness services
# sit somewhere non-default (e.g. an OpenChamber server kept apart from a desktop app). An exported
# variable still wins; PATH stays `tool_path`. Default: none.
# [tool_env]
# OPENCHAMBER_DATA_DIR = "~/.local/share/shoal/openchamber"

# ssh routes to the other hosts of a multi-host shoal: this host's viewer gives their roles cards and
# attaches them by running that host's `shoal view` over ssh. One table per other host's `server` name.
# `resolve = "tailscale"` (the default when tailscale is on PATH) looks the name up with
# `tailscale ip -4`, so a host whose resolver does not accept tailnet DNS still reaches a MagicDNS name.
# Optional: ssh_opts (extra ssh arguments), cli (the shoal command there; default `shoal` under bash -lc),
# pool (false: leave that host out of CI pool placement without probing it, e.g. a session-only laptop).
# Default: no routes (other hosts' roles are shown, never attached).
# [hosts.<server>]
# ssh = "<user>@<magicdns-name>"
# pool = false
# cli = "python3 /path/to/pre-release-checkout/shoal/cli.py"   # a trial of unreleased code on that host

# CI pool placement (`job run --place`, `shoal pool`): where a placed job's pushed SHA is staged as a
# detached worktree on this host (a mirror clone per repository sits under `.mirrors/` there).
# Env: SHOAL_WORKTREE_ROOT. Default: <data_root>/_pool/worktrees
# worktree_root = "/path/to/scratch/worktrees"

# Keep this host out of CI pool placement entirely (a session-only host): it is never a placement
# candidate, answers `pool probe` at once with pool=false, and takes no reservations. Like every
# top-level key, it goes above the first [table] in a real host.toml. Default: true
# pool = false

# Named CI environments this host offers placed jobs (`job run --ci-env NAME` is placed only on hosts
# that have NAME). `python` is the interpreter (its directory is put first on PATH and exported as
# SHOAL_ENV_PYTHON); `repos` lists the repositories it serves (empty: any). Default: none.
# [ci_envs.<name>]
# python = "/path/to/venvs/<name>/bin/python"
# repos = ["<owner>/<repo>"]

# Memory ceilings for lane jobs (`shoal job run`) on this host: each job unit's MemoryMax, and the shared
# `shoal-jobs.slice` every job unit runs in (MemoryHigh throttles the slice, MemoryMax OOM-kills inside it). systemd
# sizes ("16G", "512M", "25%" of RAM; a bare number is GiB); 0 or "" turns a ceiling off. These win over the spec's
# features.placement values. Default: 16G per job, 18G high and 20G max for the slice.
# [jobs]
# memory_max = "16G"
# slice_memory_high = "18G"
# slice_memory_max = "20G"

# Repositories whose .shoal/lifecycle.toml [hooks] this host runs (docs/lifecycle.md). Hooks are code
# execution from repository content, so they are ignored for any repository not listed. Default: []
# [lifecycle]
# trusted_repos = ["/path/to/repository"]

# Minutes between the graph feed's pulls of this host's ledger clone (`shoal ui graph-feed`). A host that runs roles
# keeps its clone current through them; one that runs none (a laptop that only views) has nothing else that pulls, so
# its home cards and lattice show an old copy. Default: 0 (never).
# ledger_pull_min = 5

# The model and effort a session moved to a provider gets when the handoff names none (`shoal handoff --ecosystem`, the
# Handoff dialog). Without them, a provider's empty model means whatever its own client last saved as its default, which
# an interactive model pick can change for every later session. Moving back to a provider gets these again. Default: none.
# [provider_defaults.codex]
# model = "<codex model>"
# effort = "high"
# [provider_defaults.claude]
# model = "<claude model>"
# effort = "high"

# More than one account of a provider on this host (shoal/accounts.py; `shoal accounts --check` lists them and asks each
# provider's CLI for its sign-in). An account is the provider's CLI with these variables: what sits behind them (shared
# or separate settings) is yours, and SHOAL reads only the account's state directory (Claude: CLAUDE_CONFIG_DIR, Codex:
# CODEX_HOME). Each provider keeps its default account, named after it. A role or seat records its account; handoff,
# add-role and the Actions dialog take one (`--account`). Default: none (one account per provider, as before).
# [accounts]
# select = "balance"       # the suggested account: the most quota to use before its reset (default), or "default"
# exclude = ["opencode"]   # providers kept out of balancing (`--ecosystem auto` never picks them)
# keepalive = true         # the usage meter refreshes a lapsing Claude sign-in through the CLI (a tiny call, ~3/day)
# rebalance = true         # the quorum's automatic context restart moves a role to the balanced account of its provider
# quota_handoff = true     # a quiet role moves off an account near a limit, or over its share, to the one most under
# reserve_pct = 2          # percent of a window kept back to restart elsewhere: a role leaves an account only then
# reset_grace_min = 30     # a window resetting this soon counts as fresh: its roles ride it out (default 30)
# near_5h = 70             # optional explicit override of 100 - reserve_pct for a 5 h window; near_week likewise
# quota_cooldown_min = 60  # a role moved for quota is not moved again sooner (default 60)
# pin = ["<role-slug>"]    # roles balancing keeps on their own provider
# [accounts.capacity]      # what each plan buys, in units where a Claude Max plan is 100 (Codex Plus 18, Pro 125)
# claude = "max"           # a default account by its provider's name; a plan, a number, or { plan = "plus", units = 20 }
# codex = "plus"
# [accounts.prefer]        # optional: the roles balancing may move onto a provider (default: any role)
# codex = ["<role-slug>"]
# [accounts.claude-2]
# provider = "claude"
# env = { CLAUDE_CONFIG_DIR = "~/.claude-2" }
# badge = "2"              # optional: the mark on its card icon (default: the name's trailing digits)

# CI efficiency rows (`shoal efficiency snapshot`, shoal/efficiency.py): merged lines per unit of CI cost, per repository
# and UTC day, and per shoal from the role-time journal. Every key is optional.
# [efficiency]
# out = "/path/to/efficiency.jsonl"      # default <data_root>/_efficiency/efficiency.jsonl
# cache_dir = "/path/to/cache"           # merged PR file lists (default: beside `out`)
# store = "/path/to/_ci_wait"            # the ci-wait store (default <data_root>/_ci_wait)
# role_time_dir = "/path/to/role-time"   # the role-time observer's --state-dir (default: each shoal's state dir)
# exclude = ["*.lock", "vendored/*"]     # replaces the default exclusion globs (fnmatch: `*` crosses `/`)
# buckets = [50, 500]                    # PR size bucket bounds, in counted changed lines
# min_coverage = 0.5                     # a shoal's role-time ratios need this share of eligible time classified
# experiments = "/path/to/experiments.jsonl"   # `efficiency review`'s experiments log (default: beside `out`)
# report_dir = "/path/to/reports"        # where the dated review reports go (default: <out dir>/reports)
# baseline = ["2026-01-05", "2026-01-11"]   # a fixed window every review compares against (default: none)
# review_seat = "<seat label>"           # wake this saved standalone seat after a review (default: none, off)
